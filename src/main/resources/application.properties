#app
app.role.admin=ADMIN
app.role.user=USER
app.common.currencyFormat=#,##0.00

#spring
spring.application.name=ClientControl
spring.main.banner-mode=off
spring.thymeleaf.cache=false
spring.devtools.livereload.enabled=true
#spring.messages.encoding=UTF-8

#logging
logging.pattern.dateformat=hh:mm
logging.level.org.springframework.security=DEBUG

#conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/clientControl?useSSL=false&useTimezone=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=MySQLUser
spring.datasource.password=MySQLPass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#hibernate
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl