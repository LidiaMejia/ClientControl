<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns="http://www.w3.org/1999/xhtml"
      th:attr="data-bs-theme=${theme}">

    <head th:replace="~{layout/layout :: head}">
        <title>[[${error.title}]]</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </head>

    <body class="d-flex flex-column min-vh-100">
        <!-- Header -->
        <header th:replace="~{layout/layout :: header}"></header>
        
        <div class="container py-5">
            <div class="row">
                <div class="col-md-6 mx-auto">
                    <div class="card text-center">
                        <img th:src="@{${error.image}}" th:style="'width: 15rem;'" class="card-img-top mx-auto" alt="ErrorImage">
                            <div class="card-body mt-3">
                                <h5 th:text="${error.title}" class="card-title"></h5>
                                <p th:text="${error.message}" class="card-text" ></p>
                                <a th:href="@{/}" th:text="#{action.return}"></a>
                            </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <footer th:replace="~{layout/layout :: footer}"></footer>

        <!-- Scripts -->
        <section th:replace="~{layout/layout :: scripts}"></section>
    </body>

</html>
